name: test

on:
  pull_request:
    branches: [main]

jobs:
  # Build, typecheck, and the 117 tests across core + desktop -- all
  # display-free, including a happy-dom harness that boots the real renderer
  # over the real engine. None of it needs a display, Xvfb, root, or
  # Electron's 283 MB runtime binary: the desktop build marks electron
  # external (scripts/bundle.js), nothing under tests/ imports it at runtime,
  # and typecheck only needs the npm package's .d.ts files, which install
  # regardless of whether the binary download ran. That makes this job a
  # candidate for a smaller, cheaper runner than ubuntu-latest -- not decided
  # here, so it stays on ubuntu-latest for now.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repo root is the pnpm workspace root, and the vp version is read from
      # the catalog every package points at.
      #
      # ELECTRON_SKIP_BINARY_DOWNLOAD skips the ~283 MB fetch in electron's
      # postinstall. Nothing this job runs spawns the binary, so there is
      # nothing to fetch it for; the package itself -- including the .d.ts
      # files `vp run check` needs -- still installs normally, since only the
      # binary fetch is gated by this variable.
      #
      # cache-save is off here on purpose. Electron's binary is a build side
      # effect that lives inside the pnpm store path, so with the download
      # skipped, a cache saved from this job would poison the entry the smoke
      # job restores: it would find an electron package with no dist/ and
      # fail trying to spawn a binary that was never downloaded, which would
      # look like a broken app rather than a broken cache. Restoring stays on,
      # so this job still benefits from whatever the smoke job saved; it just
      # never writes back, so it can never be the one that poisons it.
      - uses: voidzero-dev/setup-vp@v1.19.0
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          cache-save: false
          run-install: true

      # The same root scripts anyone runs locally; see package.json.
      #
      # @uno/core's exports point at dist/, which is not committed, so the
      # desktop package has nothing to type check or bundle against until the
      # build has run.
      - name: Build
        run: vp run build

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

  # The one thing the job above cannot cover: does the real app actually run?
  # `vp run smoke` boots the real built main, preload, and renderer bundle
  # against a real fixture in a real (virtual) display, so it needs the two
  # things `test` deliberately skips: a display and Electron's actual binary.
  # `needs: test` means a PR that fails typecheck, lint, or the unit tests
  # never spins up this heavier, slower job at all.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A normal install with the binary download and cache saving both left
      # on: this is the job that actually needs Electron working, so it is
      # the one that should own writing the shared cache entry.
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: true

      # Jobs run on separate, fresh runners, so none of the `test` job's build
      # output carries over here. @uno/core's exports point at dist/, which is
      # not committed, so the desktop package has nothing to bundle against
      # until this runs.
      - name: Build
        run: vp run build

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # is built on, and Electron exits rather than run without one.
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The runner has no display; the image ships Xvfb for exactly this.
      - name: Smoke test the desktop client
        run: xvfb-run --auto-servernum vp run smoke

      - name: Upload the smoke screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-window
          path: apps/desktop/out/smoke/window.png
          if-no-files-found: ignore

  # The hosted version, apps/www, builds against @uno/core and @uno/desktop
  # through link: dependencies, so a change in what either exports can break
  # it with no signal here: its own presubmit runs against uno's main once a
  # day, after the change has landed. This job is that signal on the pull
  # request itself. The submodule is checked out at the commit this tree
  # records and built, checked and tested the way its presubmit does.
  #
  # apps/www is a private repository, which the workflow token cannot read.
  # HOSTED_TOKEN is a repository secret holding a token with read access to
  # flacyak/uno-hosted's contents; a fine-grained personal access token
  # scoped to that one repository is enough. A pull request from a fork is
  # handed no secrets, so the job does not run for one.
  #
  # `needs: test` keeps a red run readable: uno's own build, check and tests
  # have passed by the time this starts, so what fails here is the hosted
  # build against them.
  hosted:
    needs: test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require the hosted token
        env:
          HOSTED_TOKEN: ${{ secrets.HOSTED_TOKEN }}
        run: |
          if [ -z "$HOSTED_TOKEN" ]; then
            echo "::error title=HOSTED_TOKEN is not set::Add a repository secret named HOSTED_TOKEN holding a token that reads flacyak/uno-hosted."
            exit 1
          fi

      # The gitlink is the one commit of apps/www this tree is known to build
      # with, and it is what the checkout below fetches.
      - name: Read the recorded apps/www commit
        id: gitlink
        run: echo "sha=$(git rev-parse HEAD:apps/www)" >> "$GITHUB_OUTPUT"

      - name: Check out apps/www
        uses: actions/checkout@v7
        with:
          repository: flacyak/uno-hosted
          ref: ${{ steps.gitlink.outputs.sha }}
          path: apps/www
          token: ${{ secrets.HOSTED_TOKEN }}

      # Two workspaces, one store: both lock files name the cache key. The
      # same ELECTRON_SKIP_BINARY_DOWNLOAD and cache-save reasoning as the
      # test job: nothing here spawns Electron, and an entry saved without
      # its binary must never be the one the smoke job restores.
      - uses: voidzero-dev/setup-vp@v1.19.0
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          cache-save: false
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/www/pnpm-lock.yaml
          run-install: true

      # @uno/core's exports point at dist/, and the desktop's renderer imports
      # its compiled messages, which its build writes. The hosted packages
      # have nothing to resolve against until both have run.
      - name: Build uno
        run: vp run build

      - name: Install apps/www
        working-directory: apps/www
        run: vp install

      - name: Build apps/www
        working-directory: apps/www
        run: vp run build

      - name: Check apps/www
        working-directory: apps/www
        run: vp run check

      - name: Test apps/www
        working-directory: apps/www
        run: vp run test
