name: test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal
    steps:
      - uses: actions/checkout@v7

      # internal/ is the pnpm workspace root and has no package.json of its own,
      # so the vp version is read from the catalog both packages point at.
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          working-directory: internal
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: true

      - name: Check the core
        working-directory: internal/grid
        run: vp check

      - name: Run the core suite
        working-directory: internal/grid
        run: vp test

      # @uno/grid's exports point at dist/, which is not committed, so the
      # desktop package has nothing to type check or bundle against until this
      # has run.
      - name: Build the core
        working-directory: internal/grid
        run: vp pack

      - name: Check the desktop client
        working-directory: internal/desktop
        run: vp check

      - name: Run the desktop suite
        working-directory: internal/desktop
        run: vp test

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # is built on, and Electron exits rather than run without one.
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The runner has no display; the image ships Xvfb for exactly this.
      - name: Smoke test the desktop client
        working-directory: internal/desktop
        run: xvfb-run --auto-servernum vp run smoke

      - name: Upload the smoke screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-window
          path: internal/desktop/out/smoke/window.png
          if-no-files-found: ignore
