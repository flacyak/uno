name: test

on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the toolkit's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev

      - name: Check the tree is formatted
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Run the suite
        run: |
          go test -race ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if grep -q "Error in Fyne call thread" test.log; then
            echo "::error title=Fyne call thread::Something touched a widget off the UI goroutine."
            exit 1
          fi
          exit "$status"
