# One button releases uno: Actions, release, Run workflow, a version, Run.
#
# The version typed there is the release's. It becomes the tag, v<version>,
# the name of every zip, and the version the packaged app reports; the
# package.json files stay at 0.0.0. Each platform is packaged on a runner of
# its own kind, since a macOS app is signed on macOS and a Windows executable
# stamped on Windows, and one job then publishes every zip and their checksums
# as one GitHub release, with notes written from the pull requests since the
# last one. A version that is no version, or already released, stops the run
# before a runner is started.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, such as 0.2.0, or 0.3.0-rc.1 for a prerelease. The tag is v<version>."
        required: true
        type: string

permissions:
  contents: write

# One release at a time, and a second button press waits for the first.
concurrency:
  group: release

jobs:
  # Refuses a bad version here, before six runners build on it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Not a version::'$VERSION' is not a version such as 0.2.0 or 0.3.0-rc.1."
            exit 1
          fi
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error title=Already released::The tag $tag exists. Pick the next version."
            exit 1
          fi
          # A dash marks a prerelease, as in 0.3.0-rc.1.
          prerelease=false
          [[ "$VERSION" == *-* ]] && prerelease=true
          {
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # One zip per job, each on the runner that can finish it: the macOS bundle
  # is ad-hoc signed by codesign, and the Windows executable's metadata is
  # written by rcedit, which runs natively there. The other architecture of
  # each platform is packaged on the same runner, since the packager downloads
  # the Electron release it is asked for. The one zip a runner can also start,
  # Linux x64, is driven through the whole smoke before it is uploaded, so a
  # release ships nothing that does not open.
  package:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-latest, platform: darwin, arch: arm64 }
          - { runner: macos-latest, platform: darwin, arch: x64 }
          - { runner: windows-latest, platform: win32, arch: x64 }
          - { runner: windows-latest, platform: win32, arch: arm64 }
          - { runner: ubuntu-latest, platform: linux, arch: x64, smoke: true }
          - { runner: ubuntu-latest, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # The same install as test.yml's test job, for the same reasons: the
      # packager fetches the Electron release of the target itself, so the
      # ~100 MB binary electron's postinstall would download is never run, and
      # a cache entry saved without it must never be the one the smoke
      # restores.
      - uses: voidzero-dev/setup-vp@v1.19.0
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          cache-save: false
          run-install: true

      - name: Build
        run: vp run build

      - name: Package
        working-directory: apps/desktop
        run: node scripts/package.js --version "${{ needs.version.outputs.version }}" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # As test.yml's smoke job: Ubuntu 24.04 blocks the unprivileged user
      # namespaces Chromium's sandbox is built on, and the runner has no
      # display, so the packaged uno runs under Xvfb.
      - name: Allow the Electron sandbox
        if: matrix.smoke
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test the packaged app
        if: matrix.smoke
        working-directory: apps/desktop
        run: xvfb-run --auto-servernum node --import ../../paths.js scripts/smoke.js --app out/package/uno-linux-x64/uno

      - uses: actions/upload-artifact@v7
        if: always() && matrix.smoke
        with:
          name: smoke-window
          path: apps/desktop/out/smoke/window.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: uno-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/out/package/*.zip
          if-no-files-found: error
          # The zip is compressed already.
          compression-level: 0

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      # The zips alone: the smoke's screenshot is an artifact of the run, not
      # of the release.
      - uses: actions/download-artifact@v7
        with:
          pattern: uno-*
          path: release-artifacts
          merge-multiple: true

      - name: Write the checksums
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          sha256sum -- *.zip > checksums.txt
          cat checksums.txt

      # `gh release create` makes the tag on the commit the button was pressed
      # on. The notes are GitHub's, from the pull requests merged since the
      # last release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "uno $VERSION" \
            --generate-notes "${flags[@]}" release-artifacts/*
