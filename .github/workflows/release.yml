# A git tag is the single source of truth for uno's version. Pushing v1.2.0
# packages the desktop app for Linux, macOS and Windows, runs the smoke checks
# against the packaged Linux app, and publishes one GitHub release holding
# every installer and their checksums.
#
# Each platform is packaged on a runner of its own kind, because
# electron-builder makes an installer with that platform's own tools: NSIS on
# Windows, hdiutil and codesign on macOS, AppImage and dpkg on Linux.
# apps/desktop/electron-builder.yml says what each makes. One job then
# creates the release from what the three uploaded, so there is one process
# creating it and no ordering to arrange between the packagers.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      # One platform failing leaves the other two's installers to look at.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The same install the smoke job in test.yml does: Electron's binary is
      # downloaded, because electron-builder packages it and the smoke step
      # starts it. The cache is the one that job writes.
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: true

      # package.json holds 0.0.0 in the repository. The tag is the version,
      # and writing it here is what names the installers and what
      # app.getVersion() answers inside the packaged app.
      - name: Take the version from the tag
        shell: bash
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # @uno/core's exports point at dist/, which is not committed, so the
      # desktop package has nothing to bundle against until this has run.
      - name: Build
        run: vp run build

      # The same root script anyone runs locally; see package.json. It builds
      # the desktop app again and packages it for this runner's platform.
      - name: Package
        run: vp run package

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # is built on, and Electron exits rather than run without one.
      - name: Allow the Electron sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # test.yml smokes the built bundles under Electron from node_modules.
      # This smokes the packaged app itself, the layout a person installs: the
      # bundles inside the asar, the engine started from it, the renderer
      # loaded over file://. The unpacked folder is what the AppImage and the
      # .deb carry, and runs with no FUSE or dpkg on the runner.
      - name: Smoke test the packaged app
        if: runner.os == 'Linux'
        env:
          UNO_SMOKE_APP: ${{ github.workspace }}/apps/desktop/out/release/linux-unpacked/uno
        run: xvfb-run --auto-servernum vp run smoke

      - name: Upload the smoke screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-window
          path: apps/desktop/out/smoke/window.png
          if-no-files-found: ignore

      # Only the installers. electron-builder also leaves the unpacked app and
      # its own metadata in out/release, which no release needs.
      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: apps/desktop/out/release/uno_*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-artifacts

      - name: Write the checksums
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          sha256sum -- * > "${RUNNER_TEMP}/checksums.txt"
          mv "${RUNNER_TEMP}/checksums.txt" .
          ls -l

      # The notes open with how to install, then GitHub's own list of what
      # merged since the last release. A tag with a hyphen, v1.2.0-rc.1, is a
      # pre-release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          notes="$(cat <<'NOTES'
          ## Installing

          - **Linux**: the `.AppImage` runs as it is, once it is executable. The `.deb` installs on Debian and Ubuntu.
          - **macOS**: open the `.dmg` and drag uno to Applications. The app is not notarized, so the first time, open it from the context menu with Open, then confirm.
          - **Windows**: run the `.exe`. It installs for the current user.

          `checksums.txt` holds the SHA-256 of every file.
          NOTES
          )"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes \
            "${prerelease[@]}" \
            release-artifacts/*
