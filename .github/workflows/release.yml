# A git tag is the single source of truth for uno's version.
#
# Electron does not cross-build its installers: a .dmg wants macOS and an NSIS
# installer wants Windows. So each platform packages on its own runner and
# uploads what it built, and one job at the end creates the release from all of
# them. The release is only created after every platform has passed, so a failed
# build never leaves a half-populated release behind.
name: release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the job that creates the release can write.
permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: macos-latest
            platform: mac
          - runner: windows-latest
            platform: win
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # bash on Windows too, so the steps below are written once.
        shell: bash
        working-directory: internal
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          working-directory: internal
          # The vite-plus catalog entry, so CI runs the vp the lockfile does.
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile

      # Through `vp exec`, so this is the workspace's own vp. The global one
      # looks for TypeScript Go next to its own install rather than the
      # project's, finds none, and fails the declaration build.
      - name: Build @uno/grid
        run: vp exec --filter @uno/grid -- vp pack

      - name: Build @uno/desktop
        run: vp run --filter @uno/desktop build

      # --publish never: electron-builder publishes on its own when it sees a
      # tag in CI, and the release belongs to the job below.
      - name: Package
        working-directory: internal/desktop
        run: |
          vp exec -- electron-builder --${{ matrix.platform }} --publish never \
            -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      # The installers only. out/release also holds the unpacked app and
      # electron-builder's update metadata, and uno has no updater to read it.
      - uses: actions/upload-artifact@v7
        with:
          name: uno-${{ matrix.platform }}
          path: |
            internal/desktop/out/release/*.AppImage
            internal/desktop/out/release/*.tar.gz
            internal/desktop/out/release/*.dmg
            internal/desktop/out/release/*.exe
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksum the artifacts
        working-directory: release
        run: sha256sum -- * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # v1.2.0-rc.1 is a prerelease; v1.2.0 is not.
          prerelease: ${{ contains(github.ref_name, '-') }}
