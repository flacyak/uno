<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The renderer loads nothing from the network: no fonts, no analytics, no
         CDN. A spreadsheet is somebody's data, and an app that opens one should
         not be talking to anyone about it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uno</title>
  </head>
  <body>
    <!-- tabindex, because the grid handles arrow keys and needs the focus to
         receive them. -->
    <!-- The elements are here and their words are not: shell/page.ts writes
         those in the language the app is in. -->
    <div id="app" tabindex="0">
      <!-- Three columns: the sidebar, the sheet, and the sources panel. Each
           begins with a head one row high, so the heads make one line across
           the top of the window, with the × at its end. -->
      <div class="win-frame">
        <!-- The workspaces opened on this machine, most recent first. The one
             open lists its sources under it. -->
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-head col-head"></div>
          <div class="sidebar-list" id="workspaces"></div>
          <button id="new" class="sidebar-new" type="button">
            <span class="plus">+</span><span class="label"></span>
          </button>
        </aside>

        <!-- The sheet: the grid, or the empty state, under the recogniser's
             question while it has one. -->
        <div class="win-sheet">
          <!-- Shown in transform, when the recogniser has something to ask. -->
          <div class="banner" id="banner" hidden></div>

          <div class="dropzone" id="empty">
            <h1></h1>
            <p><a href="#" id="open"></a></p>
            <p class="exts">csv &middot; tsv &middot; uno</p>
          </div>

          <!-- tabindex, because the grid listens for arrow keys here and a
               plain div cannot take focus. -->
          <div id="content" tabindex="0" hidden></div>
        </div>

        <!-- The sources panel, on the right while it is open. -->
        <aside id="panel" class="panel" hidden></aside>
      </div>

      <div class="win-status">
        <!-- Settings: the places sources come from, the theme, and the keys. -->
        <button id="settings" class="settings-toggle" type="button"></button>
        <button id="sidebar-toggle" class="side-toggle" type="button"></button>
        <span id="status-mode" class="mode"></span>
        <!-- The : command line. While it is open it stands in for the file's line. -->
        <input id="status-cmd" class="cmd" hidden spellcheck="false" autocomplete="off" />
        <span id="status-file"></span>
        <span class="sep">&middot;</span>
        <span id="status-msg"></span>
        <span class="grow"></span>
        <!-- Keys waiting for the rest of a command, where vim's showcmd puts them. -->
        <span id="status-keys" class="keys"></span>
        <span id="status-cell"></span>
        <!-- The switch between view and transform, while a workspace is open. -->
        <span id="mode-switch" class="seg" hidden>
          <span data-mode="view"></span><span data-mode="transform"></span>
        </span>
        <button id="panel-toggle" class="panel-toggle" type="button"></button>
      </div>

      <!-- The window has no frame of its own, so closing it is here. -->
      <button id="close" class="win-close" type="button">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path
            d="M2 2l6 6M8 2l-6 6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>

    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
